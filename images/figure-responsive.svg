<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 520" width="960" height="520" role="img" aria-labelledby="t2 d2">
  <title id="t2">One layout, three screen sizes</title>
  <desc id="d2">Desktop, tablet and phone frames showing the same responsive page with one, two and three stacked content blocks.</desc>

  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0c1420"/>
      <stop offset="1" stop-color="#12202e"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ce6b4"/>
      <stop offset="1" stop-color="#7aa7ff"/>
    </linearGradient>
  </defs>

  <rect width="960" height="520" fill="url(#sky)"/>
  <g stroke="#1b2937" stroke-width="1">
    <path d="M0 65 H960 M0 130 H960 M0 195 H960 M0 260 H960 M0 325 H960 M0 390 H960 M0 455 H960"/>
  </g>

  <!-- desktop -->
  <g>
    <rect x="46" y="86" width="430" height="300" rx="14" fill="#f7fafc" stroke="#2b3a4a"/>
    <rect x="46" y="86" width="430" height="34" rx="14" fill="#e6edf5"/>
    <rect x="46" y="110" width="430" height="10" fill="#e6edf5"/>
    <circle cx="68" cy="103" r="5" fill="#ff5f57"/>
    <circle cx="86" cy="103" r="5" fill="#febc2e"/>
    <circle cx="104" cy="103" r="5" fill="#28c840"/>
    <rect x="70" y="140" width="150" height="16" rx="4" fill="#c9d9e8"/>
    <rect x="70" y="170" width="382" height="70" rx="8" fill="#dbe7f3"/>
    <rect x="70" y="256" width="118" height="58" rx="8" fill="#e3edf6"/>
    <rect x="200" y="256" width="118" height="58" rx="8" fill="#e3edf6"/>
    <rect x="330" y="256" width="118" height="58" rx="8" fill="#dbe7f3"/>
    <rect x="70" y="330" width="280" height="10" rx="5" fill="#dbe7f3"/>
    <rect x="70" y="350" width="200" height="10" rx="5" fill="#e3edf6"/>
    <text x="46" y="416" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#e8eef7">Desktop · 1440 px</text>
    <text x="46" y="438" font-family="Consolas, monospace" font-size="13" fill="#93a3b8">3 columns · wide gaps · full nav</text>
  </g>

  <!-- tablet -->
  <g>
    <rect x="512" y="128" width="196" height="258" rx="14" fill="#f7fafc" stroke="#2b3a4a"/>
    <rect x="512" y="128" width="196" height="26" rx="14" fill="#e6edf5"/>
    <rect x="512" y="146" width="196" height="8" fill="#e6edf5"/>
    <rect x="530" y="172" width="110" height="14" rx="4" fill="#c9d9e8"/>
    <rect x="530" y="198" width="160" height="54" rx="8" fill="#dbe7f3"/>
    <rect x="530" y="262" width="76" height="48" rx="8" fill="#e3edf6"/>
    <rect x="614" y="262" width="76" height="48" rx="8" fill="#dbe7f3"/>
    <rect x="530" y="322" width="160" height="9" rx="4" fill="#dbe7f3"/>
    <rect x="530" y="338" width="120" height="9" rx="4" fill="#e3edf6"/>
    <text x="512" y="416" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#e8eef7">Tablet · 768 px</text>
    <text x="512" y="438" font-family="Consolas, monospace" font-size="13" fill="#93a3b8">2 columns · stacked</text>
  </g>

  <!-- phone -->
  <g>
    <rect x="744" y="146" width="130" height="240" rx="20" fill="#f7fafc" stroke="#2b3a4a"/>
    <rect x="786" y="152" width="46" height="7" rx="4" fill="#c9d9e8"/>
    <rect x="760" y="180" width="70" height="12" rx="4" fill="#c9d9e8"/>
    <rect x="760" y="204" width="98" height="44" rx="8" fill="#dbe7f3"/>
    <rect x="760" y="258" width="98" height="36" rx="8" fill="#e3edf6"/>
    <rect x="760" y="304" width="98" height="36" rx="8" fill="#dbe7f3"/>
    <rect x="760" y="352" width="70" height="8" rx="4" fill="#dbe7f3"/>
    <rect x="760" y="368" width="50" height="8" rx="4" fill="#e3edf6"/>
    <text x="744" y="416" font-family="Segoe UI, sans-serif" font-size="15" font-weight="600" fill="#e8eef7">Phone · 390 px</text>
    <text x="744" y="438" font-family="Consolas, monospace" font-size="13" fill="#93a3b8">1 column · ☰ menu</text>
  </g>

  <!-- responsive arrow -->
  <rect x="46" y="462" width="868" height="4" rx="2" fill="url(#bar)"/>
  <text x="46" y="496" font-family="Consolas, monospace" font-size="13" fill="#5ce6b4">@media (max-width: 760px) { … }</text>
  <text x="914" y="496" text-anchor="end" font-family="Consolas, monospace" font-size="13" fill="#93a3b8">one HTML file → every screen</text>
</svg>
