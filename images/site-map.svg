<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 460" width="900" height="460" role="img" aria-labelledby="m1 m2">
  <title id="m1">Site map of this website</title>
  <desc id="m2">Seven boxes: home page at the top, then about, HTML notes, CSS notes, practice, validation and contact, all linked from the home page and from each other through the navigation bar.</desc>
  <defs>
    <linearGradient id="node" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16222f"/>
      <stop offset="1" stop-color="#101a25"/>
    </linearGradient>
    <linearGradient id="home" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5ce6b4"/>
      <stop offset="1" stop-color="#7aa7ff"/>
    </linearGradient>
    <style>
      .lbl { font-family: "Segoe UI", Arial, sans-serif; font-size: 20px; fill: #e9eff7; }
      .sub { font-family: Consolas, monospace; font-size: 13px; fill: #93a3b8; }
      .box { fill: url(#node); stroke: #2b3a4a; stroke-width: 2; rx: 14; }
      .lnk { stroke: #3a4d61; stroke-width: 2; fill: none; }
    </style>
  </defs>

  <rect width="900" height="460" fill="#0b1219"/>

  <!-- home -->
  <rect x="330" y="34" width="240" height="86" rx="14" fill="url(#home)"/>
  <text x="450" y="72" text-anchor="middle" font-family="Segoe UI, Arial, sans-serif" font-size="22" font-weight="700" fill="#06121a">index.html</text>
  <text x="450" y="98" text-anchor="middle" font-family="Consolas, monospace" font-size="13" fill="#0a2330">the front door</text>

  <!-- spokes -->
  <path class="lnk" d="M450 120 V150 M450 150 H150 V190"/>
  <path class="lnk" d="M450 150 H310 V190"/>
  <path class="lnk" d="M450 150 H450 V190"/>
  <path class="lnk" d="M450 150 H590 V190"/>
  <path class="lnk" d="M450 150 H750 V190"/>
  <path class="lnk" d="M310 150 V190 M590 150 V190"/>

  <!-- row of pages -->
  <g>
    <rect class="box" x="70" y="190" width="160" height="76"/>
    <text class="lbl" x="150" y="224" text-anchor="middle">about.html</text>
    <text class="sub" x="150" y="246" text-anchor="middle">who I am</text>

    <rect class="box" x="230" y="190" width="160" height="76"/>
    <text class="lbl" x="310" y="224" text-anchor="middle">html.html</text>
    <text class="sub" x="310" y="246" text-anchor="middle">notes · HTML</text>

    <rect class="box" x="390" y="190" width="160" height="76"/>
    <text class="lbl" x="470" y="224" text-anchor="middle">css.html</text>
    <text class="sub" x="470" y="246" text-anchor="middle">notes · CSS</text>

    <rect class="box" x="550" y="190" width="160" height="76"/>
    <text class="lbl" x="630" y="224" text-anchor="middle">practice.html</text>
    <text class="sub" x="630" y="246" text-anchor="middle">test site</text>
  </g>

  <!-- second row -->
  <path class="lnk" d="M230 266 V300 H150 V330"/>
  <path class="lnk" d="M470 266 V330"/>
  <path class="lnk" d="M630 266 V300 H750 V330"/>

  <g>
    <rect class="box" x="70" y="330" width="160" height="76"/>
    <text class="lbl" x="150" y="364" text-anchor="middle">validation.html</text>
    <text class="sub" x="150" y="386" text-anchor="middle">checks</text>

    <rect class="box" x="390" y="330" width="160" height="76"/>
    <text class="lbl" x="470" y="364" text-anchor="middle">contact.html</text>
    <text class="sub" x="470" y="386" text-anchor="middle">the two links</text>

    <rect class="box" x="670" y="330" width="160" height="76"/>
    <text class="lbl" x="750" y="364" text-anchor="middle">css/style.css</text>
    <text class="sub" x="750" y="386" text-anchor="middle">one stylesheet</text>
  </g>

  <text x="450" y="440" text-anchor="middle" class="sub" fill="#5ce6b4">one navigation bar on every page → any page is one click away</text>
</svg>
